<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-1-name-led.jpg</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Guides:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#080808}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- serif wordmark 'Syed Hammad' --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav-links region control" data-region="nav-links"><!-- mono uppercase nav links Work About Process Journey: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-links); a control need not have button chrome --></div>
  <div class="r-talk-pill region control" data-region="talk-pill"><!-- outlined pill button 'Let's talk' with arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop talk-pill); a control need not have button chrome --></div>
  <div class="r-motion-toggle region control" data-region="motion-toggle"><!-- mono label 'Motion on' with switch: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop motion-toggle); a control need not have button chrome --></div>
  <div class="r-header-rule region chrome" data-region="header-rule"><!-- hairline rule under the top bar --></div>
  <div class="r-kicker-role region text" data-region="kicker-role"><!-- mono kicker 'AI ENGINEER. DATA SCIENTIST. BUILDER.' --><p style="font-size:var(--r-kicker-role-font);line-height:1.05;margin:0">kicker-role</p></div>
  <div class="r-kicker-location region text" data-region="kicker-location"><!-- mono kicker 'BASED IN BENGALURU' --><p style="font-size:var(--r-kicker-location-font);line-height:1.05;margin:0">kicker-location</p></div>
  <div class="r-headline region text" data-region="headline"><!-- giant display serif 'Syed Hammad', Hammad italic --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-thesis region text" data-region="thesis"><!-- sans thesis line about enterprise data --><p style="font-size:var(--r-thesis-font);line-height:1.05;margin:0">thesis</p></div>
  <div class="r-cta-primary region control" data-region="cta-primary"><!-- filled ink pill 'Explore my work': match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta-primary); a control need not have button chrome --></div>
  <div class="r-cta-secondary region control" data-region="cta-secondary"><!-- outlined pill 'Start a conversation': match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta-secondary); a control need not have button chrome --></div>
  <div class="r-graph region chrome" data-region="graph"><!-- runtime canvas: animated nodes and edges with mono labels and one orange path --></div>
  <div class="r-proof-rule region chrome" data-region="proof-rule"><!-- hairline rule above the proof strip --></div>
  <div class="r-stat-since region text" data-region="stat-since"><!-- stat 'Building since 2019' --><p style="font-size:var(--r-stat-since-font);line-height:1.05;margin:0">stat-since</p></div>
  <div class="r-divider-1 region chrome" data-region="divider-1"><!-- vertical hairline divider --></div>
  <div class="r-stat-reco region text" data-region="stat-reco"><!-- stat '+24% recommendation accuracy' --><p style="font-size:var(--r-stat-reco-font);line-height:1.05;margin:0">stat-reco</p></div>
  <div class="r-divider-2 region chrome" data-region="divider-2"><!-- vertical hairline divider --></div>
  <div class="r-stat-forecast region text" data-region="stat-forecast"><!-- stat '+8% forecast precision' --><p style="font-size:var(--r-stat-forecast-font);line-height:1.05;margin:0">stat-forecast</p></div>
  <div class="r-divider-3 region chrome" data-region="divider-3"><!-- vertical hairline divider --></div>
  <div class="r-stat-certs region text" data-region="stat-certs"><!-- stat '5 cloud and AI certifications' --><p style="font-size:var(--r-stat-certs-font);line-height:1.05;margin:0">stat-certs</p></div>
</main>
</body>
</html>
